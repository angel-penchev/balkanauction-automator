# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  # Moves the qoax-githooks pin in .github/workflows. When a release changes
  # the hook, the check of the bump fails until the copy at
  # .githooks/commit-msg changes in the same pull request.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # Conventional Commits, because the hook checks Dependabot too.
      prefix: "ci"
    # Only this pin. Some repositories check the pins of their other actions
    # with scripts of their own.
    allow:
      - dependency-name: "qoax-community/qoax-githooks"
