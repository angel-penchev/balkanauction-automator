# Checks the commit messages and the title of a pull request with the
# commit-msg hook of qoax-githooks. The action also compares the tracked copy
# at .githooks/commit-msg with the hook of the release that it pins.
#
# The pin is a commit sha, and the comment after it names the release.
# Dependabot moves both, but it updates the comment only while the release is
# its last token. When a bump changes the hook, the compare fails and prints
# the command that writes the new hook into the copy.
name: Check commit conventions

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A pull request may cancel its own earlier run: the next one re-checks the
# whole range. A push may not, so each push gets a group of its own.
concurrency:
  group: >-
    commit-conventions-${{ github.event.pull_request.number
      || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  commit-conventions:
    # A ruleset can require this check by its name.
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: qoax-community/qoax-githooks@4abc39a4da0306503a66682044f5fe8d7f929922 # v1.1.0
